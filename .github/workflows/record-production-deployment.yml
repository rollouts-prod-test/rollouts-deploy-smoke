name: Record production deployment

# Records a real GitHub Deployment (environment `production`) for every push
# to main, then marks it in_progress and success. Nothing is actually deployed:
# the point is to emit the `deployment` and `deployment_status` webhooks that
# Cursor Rollouts ingests when the Cursor GitHub App is installed on this org.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: record-production-deployment
  cancel-in-progress: false

jobs:
  record:
    name: record
    runs-on: ubuntu-latest
    steps:
      - name: Create deployment and report success
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.sha;
            const logUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const created = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref,
              task: 'deploy',
              environment: 'production',
              production_environment: true,
              transient_environment: false,
              auto_merge: false,
              required_contexts: [],
              description: `Smoke deployment of ${ref.slice(0, 7)}`,
              payload: { source: 'record-production-deployment', run_id: context.runId },
            });
            if (created.status !== 201) {
              core.setFailed(`createDeployment returned ${created.status}: ${JSON.stringify(created.data)}`);
              return;
            }
            const deploymentId = created.data.id;
            core.info(`Created deployment ${deploymentId} for ${ref}`);

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deploymentId,
              state: 'in_progress',
              description: 'Deploying',
              log_url: logUrl,
              auto_inactive: false,
            });

            // Give the two statuses distinct timestamps.
            await new Promise((resolve) => setTimeout(resolve, 5000));

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deploymentId,
              state: 'success',
              description: `Deployed ${ref.slice(0, 7)} to production`,
              log_url: logUrl,
              environment_url: `${context.serverUrl}/${owner}/${repo}/deployments/production`,
              auto_inactive: true,
            });
            core.notice(`Deployment ${deploymentId} succeeded: ${context.serverUrl}/${owner}/${repo}/deployments/production`);
